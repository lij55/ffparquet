source:
  - path: 86l.pf
sink:
  path: rtcm.parquet
  parameters:
    compression: zstd
    encoding: plain
    statistic: false
  order:
    - name: epoch

  columns:
    - name: vrs_id
      encoding: delta_binary_packed
      statistic: false
      compression: none
      dictionary: true
    - name: epoch
      encoding: delta_binary_packed
    - name: sys
      dictionary: true
    - name: sat_id
    - name: sig_id
    - name: df397
    - name: df398
    - name: df400
      encoding: delta_binary_packed
    - name: df401
      encoding: delta_binary_packed
    - name: doppler
      dictionary: true
      compression: none
    - name: cno
      dictionary: true
    - name: lock
      dictionary: true
    - name: valid
      encoding: rle