[package]
name = "pp"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4.28"
env_logger = "0.11.8"
parquet = { version = "56.2.0", features = ["cli"] }
arrow = { version = "57.0.0", features = ["chrono-tz"] }
arrow-array = "57.0.0"
clap = { version = "4.5.51", features = ["derive"] }
eyre = "0.6.12"
serde_json = "1.0.145"
datafusion = { version = "50.3.0", features = ["serde"] }
datafusion-common = "50.3.0"
tokio = { version = "1.48.0", features = ["full"] }
async-std = { version = "1.13.2", features = ["attributes", "tokio1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.33"
url = "2.5.7"
object_store = { version = "0.12.4", features = ["aws"] }
arrow-csv = { version = "57.0.0"}
arrow-schema = "57.0.0"
rust-s3 = { version = "0.37.0",features = ["sync"], default-features = false }